name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-and-smoke:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Show environment
        run: |
          cmake --version
          python3 --version
          clang --version

      - name: Make scripts executable
        run: chmod +x scripts/smoke_default.sh

      - name: Run default smoke test
        run: scripts/smoke_default.sh

      - name: Upload result JSON
        uses: actions/upload-artifact@v4
        with:
          name: inferedge-runtime-smoke-default
          path: results/smoke_default.json
